name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"

jobs:
  linux:
    name: Linux (PipeWire)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install PipeWire and ALSA headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libpipewire-0.3-dev libspa-0.2-dev libasound2-dev libclang-dev pkg-config
      # TAW-Panel is a private repo: cargo fetches it with a read-only token
      # (repo secret TAW_PANEL_TOKEN). Not needed if TAW-Panel is public.
      - name: Access TAW-Panel
        shell: bash
        env:
          TOKEN: ${{ secrets.TAW_PANEL_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            git config --global url."https://x-access-token:${TOKEN}@github.com/TimsterAudio/TAW-Panel".insteadOf "https://github.com/TimsterAudio/TAW-Panel"
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - run: cargo build --release
      - uses: actions/upload-artifact@v4
        with:
          name: eq-box-linux-x86_64
          path: |
            target/release/eq-box
            packaging/linux/eq-box.desktop

  windows:
    name: Windows (${{ matrix.asio && 'WASAPI + ASIO' || 'WASAPI' }})
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        asio: [false, true]
    steps:
      - uses: actions/checkout@v4
      # TAW-Panel is a private repo: cargo fetches it with a read-only token
      # (repo secret TAW_PANEL_TOKEN). Not needed if TAW-Panel is public.
      - name: Access TAW-Panel
        shell: bash
        env:
          TOKEN: ${{ secrets.TAW_PANEL_TOKEN }}
        run: |
          if [ -n "$TOKEN" ]; then
            git config --global url."https://x-access-token:${TOKEN}@github.com/TimsterAudio/TAW-Panel".insteadOf "https://github.com/TimsterAudio/TAW-Panel"
          fi
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          key: asio-${{ matrix.asio }}
      - run: cargo clippy --workspace --all-targets -- -D warnings
        if: ${{ !matrix.asio }}
      - run: cargo test --workspace
        if: ${{ !matrix.asio }}
      # The asio-sys build script downloads Steinberg's ASIO SDK and uses the
      # runner's preinstalled LLVM for bindgen.
      - name: Build
        shell: bash
        run: |
          if [ "${{ matrix.asio }}" = "true" ]; then
            export LIBCLANG_PATH="C:/Program Files/LLVM/bin"
            cargo build --release --workspace --features eq-box/asio
          else
            cargo build --release --workspace
          fi
      # Load the system-wide engine DLL through COM on real Windows, run a
      # tone through it and check the EQ (see examples/apo_harness.rs).
      - name: Test the system-wide engine
        if: ${{ !matrix.asio }}
        shell: bash
        run: |
          cargo build --release -p eq-box-apo --example apo_harness
          cp target/release/examples/apo_harness.exe target/release/
          cd target/release && ./apo_harness.exe
      - uses: actions/upload-artifact@v4
        with:
          name: eq-box-windows-x86_64${{ matrix.asio && '-asio' || '' }}
          path: |
            target/release/eq-box.exe
            target/release/eq_box_apo.dll
            packaging/windows/*.ps1
