[workspace]
members = ["crates/eq-core", "crates/eq-box-apo"]

[workspace.package]
# The release version for the whole project; bumping it publishes a release.
version = "0.2.0"
edition = "2021"

[package]
name = "eq-box"
version.workspace = true
edition.workspace = true
description = "EQ Box: a native 10-band parametric EQ for Windows (WASAPI/ASIO) and Linux (PipeWire)"
authors = ["Timster's Audio Works"]
publish = false

[features]
default = []
# Steinberg ASIO support on Windows. Needs the ASIO SDK and LLVM; see README.
asio = ["cpal/asio"]

[dependencies]
eq-core = { path = "crates/eq-core" }
eframe = { version = "0.36", default-features = false, features = ["glow", "default_fonts", "persistence", "wayland", "x11"] }
egui = "0.36"
cpal = "0.18"
rfd = "0.17"
rustfft = "6.4"
taw-panel = { git = "https://github.com/TimsterAudio/TAW-Panel", rev = "29de12e21142d9f87ae85b708ed89ea18421621c" } # 0.1.0
serde = { version = "1", features = ["derive"] }
rtrb = "0.4"

[target.'cfg(target_os = "linux")'.dependencies]
pipewire = { version = "0.10", features = ["v0_3_53"] }
cpal = { version = "0.18", features = ["pipewire"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
